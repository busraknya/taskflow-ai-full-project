name: Refresh frontend dependency lockfile

on:
  push:
    branches: [fix/go-live-blockers]
    paths:
      - frontend/package.json

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Refresh lockfile and patched transitive dependencies
        working-directory: frontend
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only
      - name: Verify clean install and production audit
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
      - name: Commit lockfile updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security(deps): refresh frontend lockfile"
            git push
          fi
