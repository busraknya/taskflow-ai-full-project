name: TaskFlow CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/go-live-blockers]

permissions:
  contents: read

concurrency:
  group: taskflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/taskflow
      JWT_SECRET: ci-only-secret-value-at-least-32-characters
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Lint new authorization tests
        run: "npx eslint src/workspaces/workspaces.service.spec.ts --rule 'prettier/prettier: off'"
      - name: Existing backend lint baseline (non-blocking)
        run: npx eslint "{src,apps,libs,test}/**/*.ts"
        continue-on-error: true
      - run: npx tsc --noEmit
      - run: npm test -- --runInBand
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend lint typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  ml-service:
    name: ML API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest pip-audit
      - run: pytest -q
      - run: pip-audit -r requirements.txt

  android:
    name: Android unit tests and debug build
    # Use a stable runner and the lightweight Android Test Device (ATD) image.
    # The full API 35 image booted but its ADB shell became unresponsive in CI.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Run instrumented Room queue tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_atd
          arch: x86_64
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -wipe-data -noaudio -no-boot-anim
          disable-animations: true
          script: cd android && ./gradlew connectedDebugAndroidTest

  compose:
    name: Docker Compose validation and image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build all service images
        run: docker compose build
